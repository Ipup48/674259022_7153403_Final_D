version: '3.8'

services:
  # ---------------------------------------------
  # Backend API Service (Node.js + Express + SQLite)
  # ---------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: event-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_STORAGE=./database.sqlite
    volumes:
      - backend-storage:/app
    networks:
      - event-network

  # ---------------------------------------------
  # Frontend Web Service (React + Vite + Nginx)
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/events
    container_name: event-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - event-network

volumes:
  backend-storage:
    driver: local

networks:
  event-network:
    driver: bridge